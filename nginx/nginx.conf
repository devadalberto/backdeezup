worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host:8445$request_uri;
  }

  # ── HTTPS (TLS) ────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 500M;

    # Certificate: dev uses self-signed generated by scripts/gen-dev-certs.sh
    # Production: replace with real cert (Let's Encrypt / cert from CA)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location /static/ { alias /app/staticfiles/; }

    # Wagtail image renditions (thumbnails) -- safe to serve publicly, these are
    # resized copies only. original_images/ stays protected.
    location /media/images/ { alias /app/media/images/; }

    # SECURITY: /media/ is NOT served directly -- all sensitive files require Django auth
    # Use X-Accel-Redirect from Django views to serve via this internal location
    location /protected-media/ {
      internal;
      alias /app/media/;
    }

    location / {
      proxy_pass http://web:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 360s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 360s;
    }
  }
}
