services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: ${BACKDEEZUP_IMAGE:-backdeezup:local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - ./secrets:/app/backend_django/secrets:rw
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8845}:18444"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPUS:-1.0}'
          memory: ${WEB_MEMORY:-512M}

  celery:
    build: .
    image: ${BACKDEEZUP_IMAGE:-backdeezup:local}
    restart: unless-stopped
    command: celery -A celery_app worker -l info -c ${CELERY_CONCURRENCY:-2} -Q default,celery --without-heartbeat
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - media:/app/media
      - ./secrets:/app/backend_django/secrets:rw
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${CELERY_CPUS:-2.0}'
          memory: ${CELERY_MEMORY:-1G}

  celerybeat:
    build: .
    image: ${BACKDEEZUP_IMAGE:-backdeezup:local}
    restart: unless-stopped
    command: celery -A celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./secrets:/app/backend_django/secrets:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "-f", "celery_app beat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '${CELERYBEAT_CPUS:-0.25}'
          memory: ${CELERYBEAT_MEMORY:-192M}

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-8445}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - media:/app/media:ro
      - staticfiles:/app/staticfiles:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${NGINX_HTTP_PORT:-8844}:80"
      - "${BIND_ADDR:-127.0.0.1}:${NGINX_HTTPS_PORT:-8445}:443"
    command: ["/bin/sh", "-c", "envsubst '$$NGINX_HTTPS_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"]
    depends_on:
      - web

  # ── Optional alternative reverse proxy (Phase 48) ──────────────────────────
  # Opt-in only: `docker compose --profile caddy up -d`. nginx above is still the
  # default and keeps running alongside it (different ports) unless you stop it
  # yourself -- see docs/deployment.md for when to pick Caddy over nginx and how
  # to run Caddy-only.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/app/media:ro
      - staticfiles:/app/staticfiles:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:80:80"
      - "${BIND_ADDR:-127.0.0.1}:443:443"
    depends_on:
      - web

volumes:
  pgdata:
  media:
    external: true
    name: backdeezup_media
  staticfiles:
  caddy_data:
  caddy_config:
