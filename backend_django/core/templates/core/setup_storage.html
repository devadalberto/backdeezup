<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup — BackDeezUp</title>
<style>
:root{--g0:#000;--g1:#070707;--ga:#002e0b;--gb:#0a1a0a;--gx:#00ff41;--gm:#00c832;--gd:#008f1f;--fw:#b8ffb8;--gy:#ffb300;--gr:#ff3131;--muted:#3a5c3a;}
body{background:var(--g0);color:var(--fw);font-family:'Courier New',monospace;margin:0;padding:24px;max-width:600px;}
h1{color:var(--gx);letter-spacing:2px;margin:0 0 4px;}
.sub{color:var(--muted);font-size:12px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;}
thead tr{background:var(--gb);}
th{padding:8px 10px;color:var(--gx);text-align:left;letter-spacing:1px;}
td{padding:8px 10px;border-bottom:1px solid var(--ga);}
.badge{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:3px;font-weight:bold;color:#000;}
.ok{background:var(--gx);} .warn{background:var(--gy);} .fail{background:var(--gr);}
.err{color:var(--gr);font-size:13px;margin-bottom:12px;}
.path{color:var(--muted);font-size:12px;margin-bottom:16px;}
button{background:var(--g1);color:var(--gm);border:1px solid var(--gd);border-radius:3px;padding:8px 16px;font-family:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;margin-right:8px;}
button:hover{color:var(--gx);border-color:var(--gx);}
a.recheck{color:var(--gm);font-size:12px;}
</style>
</head>
<body>
<h1>SETUP</h1>
<div class="sub">Step 5 of 7 — Storage location</div>
<div class="path">MEDIA_ROOT: {{ media_root }}</div>

{% if error %}<div class="err">{{ error }}</div>{% endif %}

<table>
  <thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead>
  <tbody>
    <tr><td>Media write test</td><td><span class="badge {{ write_status }}">{{ write_status|upper }}</span></td><td>{{ write_detail }}</td></tr>
    <tr><td>Disk space</td><td><span class="badge {{ disk_status }}">{{ disk_status|upper }}</span></td><td>{{ disk_detail }}</td></tr>
  </tbody>
</table>

<form method="post">
  {% csrf_token %}
  <button type="submit" {% if not can_continue %}disabled{% endif %}>Continue</button>
  <a class="recheck" href=".">&#8635; Recheck</a>
</form>
</body>
</html>
