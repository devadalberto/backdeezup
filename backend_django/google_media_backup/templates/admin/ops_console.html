{% extends "admin/base_site.html" %}
{% block content %}
<h1>Drive / Photos — Ops Console</h1>

<style>
:root{--g0:#000;--g1:#0d0d0d;--g2:#111;--gb:#1e3a1e;--gx:#00ff41;--gm:#00c832;--gd:#008f1f;--ga:#005c14;--gr:#ff3131;--gy:#ffb300;--gy2:#ff8f00;--gt:#00bfff;--fw:#e0ffe0;--fs:13px;}
body,#content,#content-main{background:var(--g0)!important;color:var(--gm)!important;}
h1{color:var(--gx)!important;text-shadow:0 0 8px var(--gx);letter-spacing:2px;font-family:monospace;}
.card{border:1px solid var(--gd);border-radius:4px;padding:16px;margin:12px 0;background:var(--g1);box-shadow:0 0 6px rgba(0,255,65,.1);}
.card b{color:var(--gx);font-family:monospace;letter-spacing:1px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.btn{padding:6px 14px;border:1px solid var(--gd);background:var(--ga);color:var(--gm);border-radius:3px;cursor:pointer;font-size:var(--fs);font-family:monospace;transition:all .15s;}
.btn:hover{background:var(--gb);color:var(--gx);border-color:var(--gx);box-shadow:0 0 6px var(--gx);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-primary{background:var(--ga);color:var(--gx);border-color:var(--gm);}
.badge{background:var(--g2);border:1px solid var(--ga);border-radius:3px;padding:2px 8px;font-size:11px;color:var(--gd);font-family:monospace;}
input[type=number]{background:var(--g2);color:var(--gm);border:1px solid var(--gd);border-radius:3px;padding:3px 6px;font-family:monospace;}
pre#out{background:var(--g0);color:var(--gx);border:1px solid var(--gd);border-radius:4px;padding:12px;overflow:auto;max-height:280px;font-size:12px;font-family:monospace;white-space:pre-wrap;text-shadow:0 0 3px rgba(0,255,65,.4);}
</style>

<div class="card">
  <b>Pipeline</b>
  <div class="row" style="margin-top:10px">
    <label style="color:var(--gm)">Limit&nbsp;
      <input id="limit" type="number" value="50" style="width:80px">
    </label>
    <span class="badge">Steps 2–5 use this limit</span>
  </div>
  <ol style="margin-left:20px;color:var(--fw)">
    <li class="row" style="margin:8px 0">
      <button class="btn btn-primary" onclick="call('sync/discover?page_size=200&max_pages=10', this)">
        1) Discover (Drive media)
      </button>
    </li>
    <li class="row" style="margin:8px 0">
      <button class="btn" onclick="call('sync/download?limit='+L(), this)">2) Download</button>
    </li>
    <li class="row" style="margin:8px 0">
      <button class="btn" onclick="call('sync/import?limit='+L(), this)">3) Import (copy)</button>
    </li>
    <li class="row" style="margin:8px 0">
      <button class="btn" onclick="call('sync/verify?limit='+L(), this)">4) Verify</button>
    </li>
    <li class="row" style="margin:8px 0">
      <button class="btn" onclick="call('sync/mark-delete?limit='+L(), this)">5a) Mark Delete</button>
      <button class="btn" onclick="call('sync/commit-delete?limit='+L(), this)">5b) Commit Delete</button>
    </li>
  </ol>
</div>

<div class="card">
  <b>Output</b>
  <pre id="out">(results appear here)</pre>
</div>

<script>
function getCookie(n){const v=document.cookie.match('(^|;) ?'+n+'=([^;]*)(;|$)');return v?v[2]:'';}
function L(){return document.getElementById('limit').value||'50';}
async function call(path, btn){
  const out=document.getElementById('out');
  if(btn)btn.disabled=true;
  out.textContent='Calling /api/'+path+' ...';
  try{
    const res=await fetch('/api/'+path,{method:'POST',headers:{'X-CSRFToken':getCookie('csrftoken')}});
    const txt=await res.text();
    try{out.textContent='HTTP '+res.status+'\n\n'+JSON.stringify(JSON.parse(txt),null,2);}
    catch{out.textContent='HTTP '+res.status+'\n\n'+txt;}
  }catch(e){out.textContent='ERROR: '+e;}
  finally{if(btn)btn.disabled=false;}
}
</script>
{% endblock %}
