name: Build Docs

# GitHub Pages requires a public repo on the free plan.
# This workflow builds the docs and uploads them as an artifact instead.
# To serve docs locally: ./dev.sh docs  (port 8001)
# To serve docs on the server: see docs/deployment.md

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build docs
        run: mkdocs build --clean

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30
