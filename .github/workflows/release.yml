name: Release

# Phase 47 -- prebuilt images + versioned releases.
# Triggered by pushing a tag (vX.Y.Z for a real release, vX.Y.Z-rcN for a
# pre-release used to test this workflow itself without cutting a real one).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # create the GitHub Release
  packages: write     # push to ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for the CHANGELOG diff below

      - name: Resolve tag and version
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: VERSION file must equal the tag
        run: |
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          TAG_VERSION="${{ steps.vars.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION file says '$FILE_VERSION' but tag ${{ steps.vars.outputs.tag }} implies '$TAG_VERSION'. Bump VERSION, commit, then re-tag."
            exit 1
          fi
          echo "OK: VERSION file matches tag ($FILE_VERSION)"

      - name: Resolve base image digest
        id: base
        run: |
          docker pull python:3.12-slim
          DIGEST="$(docker inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          echo "Resolved python:3.12-slim -> $DIGEST"
          echo "python_base_image=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build \
            --build-arg PYTHON_BASE_IMAGE="${{ steps.base.outputs.python_base_image }}" \
            -t "$IMAGE:${{ steps.vars.outputs.tag }}" \
            .

      - name: Push image(s)
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker push "$IMAGE:${{ steps.vars.outputs.tag }}"
          if [ "${{ steps.vars.outputs.prerelease }}" = "false" ]; then
            docker tag "$IMAGE:${{ steps.vars.outputs.tag }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          SECTION="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$SECTION" ]; then
            SECTION="_No CHANGELOG.md section found for [$VERSION] -- this is expected for an -rc tag cut ahead of the real release entry._"
          fi
          {
            echo "notes<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---
            Image: `ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}`
            ${{ steps.vars.outputs.prerelease == 'false' && format('Also tagged `ghcr.io/{0}:latest`.', github.repository) || '' }}
