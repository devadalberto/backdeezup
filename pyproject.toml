[project]
name = "backdeezup"
version = "0.10.0"
description = "Google Photos/Drive backup service with Django REST API"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1",
    "django-ninja>=1.3",
    "django-cors-headers>=4.6",
    "python-decouple>=3.8",
    "cryptography>=44.0",
    "google-api-python-client>=2.158",
    "google-auth>=2.38",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "requests>=2.32",
    "pillow>=11.0",
    "dj-database-url>=2.3",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "psycopg2-binary>=2.9",
    "playwright>=1.59.0",
    "tqdm>=4.67.3",
    "django-apscheduler>=0.7.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.5.1",
    "wagtail>=7.4,<7.5",
    "wagtailmedia>=0.17,<0.18",
    "django-ratelimit>=4.1.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
]
dev = [
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend_django"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
exclude = ["backend_django/*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702"]

[tool.uv.sources]
